apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: streamforge-dev-transcode-worker-scaler
  namespace: streamforge-dev
  labels:
    app: streamforge-dev-transcode-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streamforge-dev-transcode-worker
  minReplicaCount: 0
  maxReplicaCount: 2
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: "https://sqs.ap-southeast-1.amazonaws.com/393698973321/streamforge-transcode-queue-dev"
        queueLength: "1"
        awsRegion: "ap-southeast-1"
        scaleOnInFlight: "true"
      authenticationRef:
        name: streamforge-dev-transcode-worker-auth
