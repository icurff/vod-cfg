# Environment: STAGING
global:
  environment: staging

services:
  backend:
    replicaCount: 1
    image:
      repository: 393698973321.dkr.ecr.ap-southeast-1.amazonaws.com/streamforge-backend
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::393698973321:role/streamforge-backend-irsa-staging"
    configMap:
      AWS_S3_BUCKET_NAME: "streamforge-media-staging-393698973321"
      AWS_SQS_QUEUE_URL: "https://sqs.ap-southeast-1.amazonaws.com/393698973321/streamforge-transcode-queue-staging"

  frontend:
    replicaCount: 1
    image:
      repository: 393698973321.dkr.ecr.ap-southeast-1.amazonaws.com/streamforge-frontend

  transcode-worker:
    image:
      repository: 393698973321.dkr.ecr.ap-southeast-1.amazonaws.com/streamforge-worker
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::393698973321:role/streamforge-worker-irsa-staging"
    configMap:
      AWS_S3_BUCKET_NAME: "streamforge-media-staging-393698973321"
      AWS_SQS_QUEUE_URL: "https://sqs.ap-southeast-1.amazonaws.com/393698973321/streamforge-transcode-queue-staging"
      AWS_SQS_QUEUE_NAME: "streamforge-transcode-queue-staging"

keda:
  maxReplicas: 3
  triggers:
    sqs:
      queueURL: "https://sqs.ap-southeast-1.amazonaws.com/393698973321/streamforge-transcode-queue-staging"
