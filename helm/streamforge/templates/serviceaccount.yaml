{{- range $name, $svc := .Values.services }}
{{- if and $svc.serviceAccount $svc.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $svc.serviceAccount.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}-{{ $name }}
  {{- if $svc.serviceAccount.annotations }}
  annotations:
    {{- toYaml $svc.serviceAccount.annotations | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
