{{- range $name, $svc := .Values.services }}
{{- if $svc.configMap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $name }}
data:
  {{- range $key, $val := $svc.configMap }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
{{- end }}

