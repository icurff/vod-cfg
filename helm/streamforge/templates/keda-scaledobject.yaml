{{- if .Values.keda.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ .Release.Name }}-{{ .Values.keda.targetService }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-{{ .Values.keda.targetService }}
spec:
  podIdentity:
    provider: aws
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Release.Name }}-{{ .Values.keda.targetService }}-scaler
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-{{ .Values.keda.targetService }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-{{ .Values.keda.targetService }}
  minReplicaCount: {{ .Values.keda.minReplicas | default 0 }}
  maxReplicaCount: {{ .Values.keda.maxReplicas | default 10 }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod | default 300 }}
  pollingInterval: {{ .Values.keda.pollingInterval | default 15 }}
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: {{ .Values.keda.triggers.sqs.queueURL | quote }}
        queueLength: {{ .Values.keda.triggers.sqs.queueLength | default "1" | quote }}
        awsRegion: {{ .Values.keda.triggers.sqs.awsRegion | default "ap-southeast-1" | quote }}
      authenticationRef:
        name: {{ .Release.Name }}-{{ .Values.keda.targetService }}-auth
{{- end }}
