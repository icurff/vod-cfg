apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: streamforge-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: streamforge
  source:
    repoURL: https://github.com/icurff/vod-cfg.git
    targetRevision: staging
    path: helm/streamforge
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: streamforge-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
