name: CD - GitOps Image Tag Updater

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service name (backend, frontend, transcode-worker)'
        required: true
        type: choice
        options:
          - backend
          - frontend
          - transcode-worker
      tag:
        description: 'Image tag / Git commit SHA'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - dev
          - staging
          - prod
  repository_dispatch:
    types: [update-image]

permissions:
  contents: write

jobs:
  update-gitops:
    name: Update Helm Values with New Image Tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Update Helm Values
        run: |
          SERVICE="${{ github.event.client_payload.service || github.event.inputs.service }}"
          TAG="${{ github.event.client_payload.tag || github.event.inputs.tag }}"
          ENV="${{ github.event.client_payload.environment || github.event.inputs.environment || 'develop' }}"
          
          echo "Updating service '$SERVICE' with image tag '$TAG' for env '$ENV'..."
          
          # Always update base values.yaml
          if [ -f helm/streamforge/values.yaml ]; then
            yq eval ".services.\"${SERVICE}\".image.tag = \"${TAG}\"" -i helm/streamforge/values.yaml
          fi
          
          # Update env-specific values if they exist
          if [ "$ENV" = "all" ] || [ "$ENV" = "dev" ] || [ "$ENV" = "develop" ]; then
            if [ -f helm/streamforge/values-dev.yaml ]; then
              yq eval ".services.\"${SERVICE}\".image.tag = \"${TAG}\"" -i helm/streamforge/values-dev.yaml
            fi
          fi
          
          if [ "$ENV" = "all" ] || [ "$ENV" = "staging" ]; then
            if [ -f helm/streamforge/values-staging.yaml ]; then
              yq eval ".services.\"${SERVICE}\".image.tag = \"${TAG}\"" -i helm/streamforge/values-staging.yaml
            fi
          fi
          
          if [ "$ENV" = "all" ] || [ "$ENV" = "prod" ] || [ "$ENV" = "production" ] || [ "$ENV" = "main" ]; then
            if [ -f helm/streamforge/values-prod.yaml ]; then
              yq eval ".services.\"${SERVICE}\".image.tag = \"${TAG}\"" -i helm/streamforge/values-prod.yaml
            fi
          fi

      - name: Commit & Push Changes
        run: |
          SERVICE="${{ github.event.client_payload.service || github.event.inputs.service }}"
          TAG="${{ github.event.client_payload.tag || github.event.inputs.tag }}"
          ENV="${{ github.event.client_payload.environment || github.event.inputs.environment || 'all' }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/streamforge/
          git commit -m "chore(cd): promote $SERVICE to $TAG on $ENV [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main || git push
